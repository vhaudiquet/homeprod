# cert-manager-webhook-porkbun Values
# groupName must match the ClusterIssuer webhook stanza
groupName: acme.saggar.dev
# cert-manager deployment configuration for RBAC
# The chart creates RoleBindings so cert-manager's service account can reach
# the webhook and read the Porkbun credential Secret
certManager:
    namespace: cert-manager
    serviceAccountName: cert-manager
# Restrict the webhook's Secret read access to the Porkbun credentials only
rbac:
    secretAccess:
        secretNames:
            - ENC[AES256_GCM,data:WXGjM38wR7oKcvetV91WocOt48njb5Y=,iv:7UEsgh62qq/0fGfmjG96Kko/r2h9IOD7IqRnu7poGFo=,tag:qdb4+n9ZnQidlz5fnHq94g==,type:str]
# Pod configuration
replicaCount: 1
