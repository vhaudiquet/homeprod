# Porkbun API Credentials for DNS-01 Challenges (saggar.dev)
#
# Create an API key at https://porkbun.com/account (API Access section), and
# enable API access on the domain: Domain Management -> Details -> API Access
# (disabled per domain by default; the API returns a generic error otherwise).
#
# The secret MUST live in the cert-manager namespace: for a ClusterIssuer,
# cert-manager reads webhook credential secrets from its cluster resource
# namespace, which the webhook chart's RBAC already covers.
#
# SOPS will encrypt the stringData fields on pre-commit.
apiVersion: v1
kind: Secret
metadata:
    name: porkbun-api-credentials
    namespace: cert-manager
    labels:
        app.kubernetes.io/name: cert-manager-webhook-porkbun
        app.kubernetes.io/component: porkbun-api-credentials
type: Opaque
