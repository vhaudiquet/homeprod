apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vm-victoria-metrics-k8s-stack
  namespace: observability
spec:
  interval: 1m
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: vm
        namespace: observability
      chart: victoria-metrics-k8s-stack
      version: "0.87.0"
      interval: 1m
  valuesFrom:
    - kind: Secret
      name: vmstack-values