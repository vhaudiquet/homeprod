apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-config
  namespace: observability
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/component: notifiers
type: Opaque
stringData:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m

    route:
      receiver: default
      group_by: ["alertname", "severity", "instance"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h

    receivers:
      - name: default
        webhook_configs:
          # n8n workflow webhook
          - url: "http://n8n.lan/webhook/observability-alert"
            send_resolved: true