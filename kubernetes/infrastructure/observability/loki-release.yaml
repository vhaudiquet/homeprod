apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: observability
spec:
  interval: 1m
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: observability
      chart: loki
      version: "18.5.4"
      interval: 1m
  valuesFrom:
    - kind: Secret
      name: loki-values