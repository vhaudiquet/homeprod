apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: observability
spec:
  interval: 1m
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: observability
      chart: alloy
      version: "1.11.0"
      interval: 1m
  valuesFrom:
    - kind: Secret
      name: alloy-values