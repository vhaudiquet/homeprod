# Loki Helm values
# Uses Monolithic deployment mode with filesystem storage on a Longhorn PVC.
loki:
    deploymentMode: Monolithic
    # Filesystem storage — chunks + rules on the PVC.
    storage:
        type: filesystem
        filesystem:
            chunks_directory: /var/loki/chunks
            rules_directory: /var/loki/rules
    # Required schema config. tsdb store + filesystem object store, schema v13.
    # See https://grafana.com/docs/loki/latest/operations/storage/schema/.
    schemaConfig:
        configs:
            - from: "2024-04-01"
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h
    # For monolithic mode, point tsdb_shipper at the local store (no index gateway).
    storage_config:
        tsdb_shipper:
            active_index_directory: /var/loki/index
            cache_location: /var/loki/index-cache
    monolithic:
        persistence:
            storageClassName: longhorn
            accessModes:
                - ReadWriteOnce
            size: 10Gi
        resources:
            requests:
                cpu: 100m
                memory: 256Mi
            limits:
                cpu: "1"
                memory: 1Gi
# 7d log retention (user can tune later).
limitsConfig:
    retention_period: 7d
# Disable distributed components + gateway + minio (monolithic only).
test:
    enabled: false
sidecar:
    rules:
        env:
            REQ_TIMEOUT: "120"
            REQ_RETRY_CONNECT: "10"
            REQ_RETRY_READ: "10"
            REQ_RETRY_TOTAL: "20"
            IGNORE_ALREADY_PROCESSED: "true"
        resources:
            requests:
                cpu: 10m
                memory: 32Mi
            limits:
                cpu: 100m
                memory: 64Mi
backend:
    replicas: 0
read:
    replicas: 0
write:
    replicas: 0
singleBinary:
    replicas: 0
gateway:
    enabled: false
minio:
    enabled: false
