ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
        - host: z2m.lan
          paths:
            - path: /
              pathType: Prefix
service:
    type: ClusterIP
statefulset:
    securityContext:
        privileged: false
        capabilities:
            add: []
