# Number of replicas
replicaCount: 1
# Container image configuration
image:
    repository: git.vhaudiquet.fr/vhaudiquet/vhaudiquet.fr
    pullPolicy: IfNotPresent
    # The image tag defaults to the chart appVersion (which is set to git SHA by CI).
    # Override this only if you need a specific version.
    tag: ""
# Image pull secrets for private registries
imagePullSecrets: []
# Ingress configuration
ingress:
    enabled: true
    className: ""
    annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    hosts:
        - host: vhaudiquet.fr
          paths:
            - path: /
              pathType: Prefix
    tls: []
# Environment variables
env:
    NGINX_HOST: vhaudiquet.fr
    NGINX_PORT: "80"
# NFS Storage configuration for public files
nfs:
    enabled: true
    # NFS server IP address
    server: truenas.lan
    # NFS export path
    path: /mnt/main_storage/public
    # Mount path inside the container
    mountPath: /usr/share/nginx/html/public
    # Storage size for PVC
    storageSize: 10Gi
    # Storage class name (leave empty for default)
    storageClassName: ""
    # Allow the pod to start even when NFS is unreachable (uses emptyDir + initContainer)
    softFail: true
# Tolerate failover nodes
tolerations:
    - key: ENC[AES256_GCM,data:whCOkQ/xDUyG,iv:MU1iyLWTp21dUA0Ukn7L4Kdmp4DcD2946/1lHrgNJJg=,tag:VdVgjP831+lV9IdabEYvOQ==,type:str]
      operator: Equal
      value: ENC[AES256_GCM,data:IXlCv4VONI8=,iv:/7uiSYGVY85/8nGgnQjeO+hClQPqWEJWOMwEZs1VuzI=,tag:gZI49sfALmsfaxjF4mP4WQ==,type:str]
      effect: NoSchedule
    - key: ENC[AES256_GCM,data:7MK/rNoqAhDUJh3O4r0b47PVfT3ItjnnCOKJWZCThzHNIrw0bw==,iv:hUCE6+NwucVw5lwktzOpXRqjG51w4g/AQceyBiduu+E=,tag:DWGdD++4ZptIsSmLpwZAsg==,type:str]
      operator: Exists
      effect: NoSchedule
# Prefer (non-failover nodes) in normal operation
affinity:
    nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                    - key: ENC[AES256_GCM,data:EDr52ZzUZjtJe+oxleIJZZCYCl8=,iv:ZafjjEMMaWYP7JKAhnRkMB9kFghd5LB593mUELzDLwQ=,tag:4EChdzHuvLSxY+fEum1Gzw==,type:str]
                      operator: NotIn
                      values:
                        - "true"
