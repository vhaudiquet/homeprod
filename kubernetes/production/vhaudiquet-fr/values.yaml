# Number of replicas
replicaCount: 1
# Container image configuration
image:
    repository: git.vhaudiquet.fr/vhaudiquet/vhaudiquet.fr
    pullPolicy: IfNotPresent
    # The image tag defaults to the chart appVersion (which is set to git SHA by CI).
    # Override this only if you need a specific version.
    tag: ""
# Image pull secrets for private registries
imagePullSecrets: []
# Ingress configuration
ingress:
    enabled: true
    className: ""
    annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
    hosts:
        - host: vhaudiquet.fr
          paths:
            - path: /
              pathType: Prefix
    tls: []
# Environment variables
env:
    NGINX_HOST: vhaudiquet.fr
    NGINX_PORT: "80"
# NFS Storage configuration for public files
nfs:
    enabled: true
    # NFS server IP address
    server: truenas.lan
    # NFS export path
    path: /mnt/main_storage/public
    # Mount path inside the container
    mountPath: /usr/share/nginx/html/public
    # Storage size for PVC
    storageSize: 10Gi
    # Storage class name (leave empty for default)
    storageClassName: ""
    # Allow the pod to start even when NFS is unreachable (uses emptyDir + initContainer)
    softFail: true
# Tolerate failover nodes
tolerations:
    - key: ENC[AES256_GCM,data:ja29UypZ8PY4,iv:OclYLpgX/HfvEBeAXsBvaAA4hB0l2Cg0JR7grR1lTTg=,tag:NdWJQdG7glFCOyDHzvXibQ==,type:str]
      operator: Equal
      value: ENC[AES256_GCM,data:kbW9J1Gq96Y=,iv:TbCK7mPcikPYnDIxMVXqCCdhoVFKdinB7D1OczpAsxU=,tag:MHHTSu4zr+BE3iY2q+l06w==,type:str]
      effect: NoSchedule
    - key: ENC[AES256_GCM,data:EmD2g2fExXx1efzKZEBR+gDI0FurCGY7drZeJQ4UWWqWD0WK9w==,iv:g4NEJKZ4VMs4CWjWhV6M3IR1f3iC+1FuoCLnrmWTneA=,tag:0G9psRenOhpP1jF4O/gB2w==,type:str]
      operator: Exists
      effect: NoSchedule
# Prefer (non-failover nodes) in normal operation
affinity:
    nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                    - key: ENC[AES256_GCM,data:Awenw5YOeHT4Ox4zmVS1bwOUqEI=,iv:H4Wh8ym80hb7Q+5ZUwFsZi7eJ4PHSLrwV6ug5o6BIzA=,tag:eEXV1rSrhj+h3uLoAPgGxw==,type:str]
                      operator: NotIn
                      values:
                        - "true"
