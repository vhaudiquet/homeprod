apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: rhema-dist
  namespace: get-rhema
spec:
  interval: 1m
  # Public org-scoped chart repository, same one CI publishes the
  # rhema-dist chart to (from git.vhaudiquet.fr/vhaudiquet/rhema.rs).
  # No auth, unlike the saggar org repo: the vhaudiquet org is public.
  url: https://git.vhaudiquet.fr/api/packages/vhaudiquet/helm
