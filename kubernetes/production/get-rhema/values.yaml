# get.rhema.rs, the rhema distribution (chart rhema-dist, repo
# vhaudiquet/rhema.rs). One single-node Garage, one bucket, the
# saggar-dist shape: the S3 API stays cluster-internal (chart default,
# s3.ingress.enabled=false — release uploads come from the in-cluster
# runners) and the bucket serves as a public read-only website.
# The host MUST be <bucket>.<root domain> — Garage resolves the bucket
# from the Host's first label — so bucket `get` on get.rhema.rs.
bucket: get
garage:
    # Single-node store: skip the hourly self-sync cycles — while a
    # full sync runs, S3 auth lookups transiently answer
    # InvalidAccessKeyId (see get-saggar). Weekly.
    fullSyncInterval: 604800
web:
    ingress:
        className: traefik
        host: get.rhema.rs
        # TLS terminates at Caddy with the cert-manager get.rhema.rs
        # cert; Caddy proxies to Traefik by host, so no tls block here.
        tls:
            enabled: false
# The write surface, public via Caddy: the release runners reach the
# S3 API by host (the in-cluster Service name does not resolve from
# them). TLS terminates at Caddy, like the web face.
s3:
    ingress:
        enabled: true
        className: traefik
        host: s3.rhema.rs
        tls:
            enabled: false
            secretName: ""
