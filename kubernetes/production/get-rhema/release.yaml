apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: get-rhema
  namespace: get-rhema
spec:
  interval: 1m
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: rhema-dist
        namespace: get-rhema
      chart: rhema-dist
      # Same CI scheme as the other vhaudiquet charts: timestamped
      # versions on main pushes, exact versions on v* tags.
      version: '>=0.1.0-0'
      interval: 1m
  valuesFrom:
    - kind: Secret
      name: get-rhema-values
