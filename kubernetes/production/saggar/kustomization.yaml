apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: saggar
resources:
  - namespace.yaml
  - packages-auth-secret.yaml
  - gitea-oidc-secret.yaml
  - repository.yaml
  - release.yaml
secretGenerator:
  - name: saggar-values
    files:
      - values.yaml=values.yaml
configurations:
  - kustomizeconfig.yaml
