# The vhaudiquet package repository on the home Gitea, where the
# rhema-together CI publishes the chart on every main push (base
# version plus a timestamp). Public: no auth.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: vhaudiquet
  namespace: rhema-together
spec:
  interval: 1m
  url: https://git.vhaudiquet.fr/api/packages/vhaudiquet/helm
