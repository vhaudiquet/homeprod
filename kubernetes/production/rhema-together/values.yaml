# together.vhaudiquet.fr — a shared room where people and a Rhema agent
# work on the same code. One pod, one SQLite file on longhorn.
image:
    repository: git.vhaudiquet.fr/vhaudiquet/rhema-together
    # Empty: follows the chart's appVersion, the commit SHA CI stamped
    # on the pushed image.
    tag: ""
app:
    # Invite and setup links are built from this origin; https makes
    # the session cookie Secure.
    publicUrl: https://together.vhaudiquet.fr
    # Preview hosts are signed subdomains of this origin. The wildcard
    # DNS record and certificate cover *.preview.together.vhaudiquet.fr.
    previewOrigin: https://preview.together.vhaudiquet.fr
    # Closed: the setup account and invite links are enough, and an
    # account can make the server open SSH connections to any host.
    allowRegistration: false
ingress:
    enabled: true
    className: traefik
    hosts:
        - host: together.vhaudiquet.fr
          paths:
            - path: /
              pathType: Prefix
        - host: '*.preview.together.vhaudiquet.fr'
          paths:
            - path: /
              pathType: Prefix
    # TLS terminates at Caddy, which proxies to Traefik by host; the
    # chart's ingress stays plain HTTP like every other public site here.
    tls: []
persistence:
    enabled: true
    storageClass: longhorn
    size: 5Gi
resources:
    requests:
        cpu: 100m
        memory: 512Mi
    limits:
        cpu: "2"
        memory: 2Gi
