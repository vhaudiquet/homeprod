# Chart: https://git.vhaudiquet.fr/saggar/saggar (chart/saggar-dist).
# One single-node Garage, one bucket: the S3 API stays cluster-
# internal (chart default — the publish workflow uploads from the
# in-cluster runners, s3.ingress.enabled=false) and the bucket serves
# as a public read-only website. The host MUST be <bucket>.<root
# domain> — Garage resolves the bucket from the Host's first label —
# so bucket `get` on get.saggar.dev.
bucket: get
web:
    ingress:
        className: traefik
        host: get.saggar.dev
        # TLS terminates at Caddy with the cert-manager saggar.dev
        # certs; Caddy proxies to Traefik by host, so no tls block
        # here (same as the other saggar hosts).
        tls:
            enabled: false
