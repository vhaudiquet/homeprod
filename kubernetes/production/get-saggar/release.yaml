apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: get-saggar
    namespace: get-saggar
spec:
    interval: 1m
    chart:
        spec:
            sourceRef:
                kind: HelmRepository
                name: saggar
                namespace: get-saggar
            chart: saggar-dist
            # Same CI scheme as the other saggar charts: timestamped
            # versions on main pushes, exact versions on v* tags.
            version: '>=0.1.0-0'
            interval: 1m
    valuesFrom:
        - kind: Secret
          name: get-saggar-values
