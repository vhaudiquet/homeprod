# rhema.rs, the static landing/download site (chart rhema-site, repo
# vhaudiquet/rhema.rs). One stateless nginx Deployment.
# TLS terminates at Caddy with the cert-manager rhema.rs certs; Caddy
# proxies to Traefik by host, so the ingress stays plain HTTP (same
# shape as every other public site here).
replicaCount: 1
ingress:
    enabled: true
    className: traefik
    siteHost: rhema.rs
    # www redirects to the apex inside nginx, so it rides the same
    # service; only the host name differs.
    wwwHost: www.rhema.rs
    tls:
        enabled: false
