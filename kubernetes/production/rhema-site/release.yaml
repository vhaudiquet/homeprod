apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rhema-site
  namespace: rhema-site
spec:
  interval: 1m
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: rhema-site
        namespace: rhema-site
      chart: rhema-site
      # Same CI scheme as the other vhaudiquet charts: timestamped
      # versions on main pushes, exact versions on v* tags.
      version: '>=0.1.0-0'
      interval: 1m
  valuesFrom:
    - kind: Secret
      name: rhema-site-values
