apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: buildpath
  namespace: buildpath
spec:
  interval: 1m
  chart:
    spec:
      sourceRef:
        kind: GitRepository
        name: buildpath
        namespace: buildpath
      chart: buildpath
      interval: 1m
  valuesFrom:
    - kind: Secret
      name: buildpath-values
