# BuildPath Helm values (SOPS auto-encrypts matching fields on commit)
# --- MongoDB ---
mongo:
    auth:
        rootUser: root
        rootPassword: ENC[AES256_GCM,data:KYOvN1TxMko=,iv:S3MLPsJoSPGwM5oHSmMR5kWaYPvz+daURgVczll0i5g=,tag:pjUS0aZopHu38Faz/REMLA==,type:str]
    wiredTigerCacheSizeGB: "1"
    resources:
        limits:
            memory: 4Gi
        requests:
            memory: 2Gi
    # 30Gi Longhorn volume for the 20G live dataset
    dataVolume:
        storageClassName: longhorn
        accessMode: ReadWriteOnce
        size: 30Gi
    configVolume:
        storageClassName: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
# --- CDRagon cache (RWX, shared between match_collector & frontend) ---
cdragon:
    enabled: true
    volume:
        storageClassName: longhorn
        accessMode: ReadWriteMany
        size: 5Gi
# --- Frontend ---
frontend:
    image:
        tag: latest
        pullPolicy: Always
    ingress:
        enabled: true
        className: ""
        annotations: {}
        host: buildpath.win
        path: /
        pathType: Prefix
        tls:
            enabled: false
    resources:
        limits:
            memory: 512Mi
        requests:
            cpu: 100m
            memory: 256Mi
# --- Match Collector ---
# Can use a lot of RAM at peak, give it headroom
matchCollector:
    image:
        tag: latest
        pullPolicy: Always
    schedule: 0 */12 * * *
    resources:
        limits:
            memory: 16Gi
        requests:
            cpu: 200m
            memory: 512Mi
