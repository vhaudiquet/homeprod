# Number of replicas
replicaCount: 1
# Container image configuration
image:
    repository: git.vhaudiquet.fr/semerys/semery.fr
    pullPolicy: IfNotPresent
    # The image tag defaults to the chart appVersion (which is set to git SHA by CI).
    # Override this only if you need a specific version.
    tag: ""
# Image pull secrets for private registries
# (image is anonymously pullable from Gitea, same as vhaudiquet-fr)
imagePullSecrets: []
# Ingress configuration
ingress:
    enabled: true
    className: ""
    annotations: {}
    hosts:
        - host: semery.fr
          paths:
            - path: /
              pathType: Prefix
    tls: []
# Tolerate failover nodes
tolerations:
    - key: ENC[AES256_GCM,data:/CMYAKY1KdK9,iv:b+SH9zZtCwROCmMLTa90L+3BiSbLr/keSjRnBTTTWWw=,tag:es0kLEhnri8WZxxl0hEwcQ==,type:str]
      operator: Equal
      value: ENC[AES256_GCM,data:cFhYWTHVVUU=,iv:7NVK68CshoAzE3SLr80R02Sh2CbH4wLGt4IAS6s2mPA=,tag:1kXlilI3sJDP+nALaS9hmw==,type:str]
      effect: NoSchedule
    - key: ENC[AES256_GCM,data:oZsPBWoZNGlsdMKsy9a0iVyFoEv3u+QuH7w9nH+LvxMZwcqYKw==,iv:1CXgeE2ulPBvqWuHGy7MMv7YVvylVVUFkhO1C7bWTy0=,tag:YWtEmfF7/2kq7aUPpkIEig==,type:str]
      operator: Exists
      effect: NoSchedule
# Prefer (non-failover nodes) in normal operation
affinity:
    nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                    - key: ENC[AES256_GCM,data:elhdFbnzEc3Hfk2WfXMMM9PJ5ZE=,iv:W+PHxb5PeCbLr7gLrysbedDZcjkQ9j9sGnL15XWhq80=,tag:pmEtrOBVmVIDEhsY0LfwsA==,type:str]
                      operator: NotIn
                      values:
                        - "true"
