apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renovate
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  - token-secret.yaml
secretGenerator:
  - name: renovate-values
    files:
      - values.yaml=values.yaml
configurations:
  - kustomizeconfig.yaml
