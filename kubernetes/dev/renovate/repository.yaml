# Upstream publishes the chart to OCI only; the legacy HTTP repo
# (docs.renovatebot.com/helm-charts) is stale and lags behind releases.
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: renovate
  namespace: renovate
spec:
  interval: 1h
  type: oci
  url: oci://ghcr.io/renovatebot/charts
