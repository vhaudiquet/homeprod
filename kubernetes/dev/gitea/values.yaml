image:
    tag: 1.27.1
    rootless: true
ingress:
    enabled: true
    hosts:
        - host: git.vhaudiquet.fr
          paths:
            - path: /
              pathType: Prefix
# Disable HA, we are on a 1-node cluster
redis-cluster:
    enabled: false
# Valkey cluster is the new default in chart 12.x - must be explicitly disabled
valkey-cluster:
    enabled: false
# Use standalone Valkey (replaces 'redis' in chart 12.x)
valkey:
    enabled: true
    master:
        resources:
            requests:
                cpu: 100m
                memory: 256Mi
            limits:
                cpu: 500m
                memory: 1Gi
postgresql:
    enabled: true
    global:
        postgresql:
            auth:
                postgressPassword: ENC[AES256_GCM,data:rMBRo26YmyMGqA==,iv:e0wbEdc+hPZXi3Lx3GKVD3wpk40lJhRSBxcZ2OsugmE=,tag:GUGn4Zn4/SvtiCEUqE8f7w==,type:str]
                password: ENC[AES256_GCM,data:Hte4fPFncct3HA==,iv:0skkN84YffZZUZ8yPiN9UC03jBLzFhd6XvdPf/uiYks=,tag:03Pz9EQXQSXdRZ5P7Qy4Mw==,type:str]
                database: gitea
                username: ENC[AES256_GCM,data:iTcG77k=,iv:u5SMbimGtZbvIRaVISQ6DubVk5Ue8uBRlLwX/gt8SrE=,tag:u986P6CoVw2jmzKiu7BOxQ==,type:str]
    volumePermissions:
        enabled: true
    primary:
        resources:
            requests:
                cpu: 100m
                memory: 256Mi
            limits:
                cpu: 500m
                memory: 1Gi
        livenessProbe:
            enabled: true
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 10
        readinessProbe:
            enabled: true
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
postgresql-ha:
    enabled: false
persistence:
    enabled: true
    subPath: data
    size: 30Gi
extraVolumes:
    - name: git
      nfs:
        server: truenas.lan
        path: /mnt/fast_app_data/git
extraContainerVolumeMounts:
    - name: git
      mountPath: /git
clusterDomain: cluster.local
gitea:
    oauth:
        - name: Authentik
          provider: openidConnect
          key: ENC[AES256_GCM,data:PvsQlwsJoK+CM8AR3c+8oW2mlUC/5fzWldkyx7G6LrEFlIaofY3wkQ==,iv:Pp/kqfmf56Y6WObS+ItUBazQkazsbVdBXKuNTgjph48=,tag:m5bKClG6BqaGDAB9nUwv5w==,type:str]
          secret: ENC[AES256_GCM,data:w4/0hCwv4OzQMkBxlZE1p09eWcUcMN776D9FUon/Z9e28vkTJX/9EyFBd/GXvQ7vfif64CwNj1ESVhjWPLqNMw09eKQPKZ23VbmfK+63YRf3nxNqVRat4JWkdhFYnB45bFbUb3kaU9AtArUJNrUXlcvk8Vx5mb6jOMat1j5bnMk=,iv:6im6Xy98syFlxLfkBxQDFRD5HDtphnY+LAxsnFLPmec=,tag:b26bKjdJZUx2RQy0LuksSA==,type:str]
          autoDiscoverUrl: https://authentik.vhaudiquet.fr/application/o/gitea/.well-known/openid-configuration
    config:
        APP_NAME: Gitea
        server:
            ROOT_URL: https://git.vhaudiquet.fr
        lfs:
            STORAGE_TYPE: local
            PATH: /git/lfs
        repository:
            ROOT: /git/repo
        database:
            DB_TYPE: postgres
        service:
            ALLOW_ONLY_EXTERNAL_REGISTRATION: true
        actions:
            ENABLED: true
        oauth2_client:
            ENABLE_AUTO_REGISTRATION: true
            ACCOUNT_LINKING: login
        openid:
            ENABLE_OPENID_SIGNIN: false
            ENABLE_OPENID_SIGNUP: false
        indexer:
            ISSUE_INDEXER_TYPE: bleve
            REPO_INDEXER_ENABLED: true
# Resource limits for Gitea container
resources:
    requests:
        cpu: 100m
        memory: 512Mi
    limits:
        cpu: 500m
        memory: 1Gi
replicaCount: 1
