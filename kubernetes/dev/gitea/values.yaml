image:
    # registry/repository are restated here (same values the chart defaults
    # to) because Renovate's helm-values manager only tracks a tag when a
    # repository sits in the same image block.
    registry: docker.gitea.com
    repository: gitea
    tag: 28.3.0
    rootless: true
ingress:
    enabled: true
    hosts:
        - host: git.vhaudiquet.fr
          paths:
            - path: /
              pathType: Prefix
# Disable HA, we are on a 1-node cluster
redis-cluster:
    enabled: false
# Valkey cluster is the new default in chart 12.x - must be explicitly disabled
valkey-cluster:
    enabled: false
# Use standalone Valkey (replaces 'redis' in chart 12.x)
valkey:
    enabled: true
    primary:
        resources:
            requests:
                cpu: 100m
                memory: 256Mi
            limits:
                cpu: 500m
                memory: 1Gi
postgresql:
    enabled: true
    global:
        postgresql:
            auth:
                postgressPassword: ENC[AES256_GCM,data:Cl29f5lLk223KQ==,iv:K1Tz2t41cC03aJngxH9A63/bDs9/5LcF7GQ+Z6sCwnk=,tag:qEWTlIS6tU0l7InoFjQRSQ==,type:str]
                password: ENC[AES256_GCM,data:YGanZYpDpBtTwA==,iv:MEuJjKtu4GJpYxkzzMUxD4jVtmqZonEP9cyFye3xOuc=,tag:6h3OSPHroFPSGeuhTvEUkg==,type:str]
                database: gitea
                username: ENC[AES256_GCM,data:LHws8aY=,iv:dxU7cMNZyVXFYkJDLEYSY7p5mVBu3sXF7g0xm8aQBuM=,tag:jh1kjZ55QcmFrs6jpI+PNg==,type:str]
    volumePermissions:
        enabled: true
    primary:
        resources:
            requests:
                cpu: 100m
                memory: 256Mi
            limits:
                cpu: 500m
                memory: 1Gi
        livenessProbe:
            enabled: true
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 10
        readinessProbe:
            enabled: true
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 10
            successThreshold: 1
            failureThreshold: 6
postgresql-ha:
    enabled: false
persistence:
    enabled: true
    subPath: data
    size: 30Gi
extraVolumes:
    - name: git
      nfs:
        server: truenas.lan
        path: /mnt/fast_app_data/git
extraContainerVolumeMounts:
    - name: git
      mountPath: /git
clusterDomain: cluster.local
gitea:
    oauth:
        - name: Authentik
          provider: openidConnect
          key: ENC[AES256_GCM,data:qy3qhgaC5TgKMbWEqEHXYDmpP0db2kzGP815IKjHWKqD937K1Vz+Vw==,iv:77INjoHnuRzyT0qnF5x32vQ4f6ufy1J4DKRWFdDZAqM=,tag:m1oYIQRTPsTEQ1X7IV3C0A==,type:str]
          secret: ENC[AES256_GCM,data:hLLEnE76+YbixG/GMzrS4Xt9OZn5sPBxzEI9V5hmva6em2UUsNJgWmiXck62lOIHFznBLfTJVa6pBUb/Etg2SEAqJx3sKbNGS2rDyGIDp4uhHNqvEGF6+5ceSN+KbCkLz+gcyyJcYF2asguLX/O9nY/yrHxadVeRQdvyU3JxvAY=,iv:aMtu+sbaUkVvfaQnfmc90ewlfa1cot5Ul2yr0wq4Tg0=,tag:ZYFnfnqtDLkrBQg3njlgHg==,type:str]
          autoDiscoverUrl: https://authentik.vhaudiquet.fr/application/o/gitea/.well-known/openid-configuration
    config:
        APP_NAME: Gitea
        server:
            ROOT_URL: https://git.vhaudiquet.fr
        lfs:
            STORAGE_TYPE: local
            PATH: /git/lfs
        repository:
            ROOT: /git/repo
        database:
            DB_TYPE: postgres
        service:
            DISABLE_REGISTRATION: true
            ALLOW_ONLY_EXTERNAL_REGISTRATION: true
        actions:
            ENABLED: true
        oauth2_client:
            ENABLE_AUTO_REGISTRATION: true
            ACCOUNT_LINKING: login
        openid:
            ENABLE_OPENID_SIGNIN: false
            ENABLE_OPENID_SIGNUP: false
        indexer:
            ISSUE_INDEXER_TYPE: bleve
            REPO_INDEXER_ENABLED: true
# A schema migration must not run underneath a still-serving old binary, and
# both pods would mount the same RWO /data volume. Stop the old pod first.
strategy:
    type: Recreate
# Resource limits for Gitea container. Sized to receive a full linux
# kernel tree: index-pack on ~12M objects needs several GiB and more
# than half a core (the 1Gi limit OOMKilled the pod mid push).
resources:
    requests:
        cpu: 500m
        memory: 1Gi
    limits:
        cpu: "4"
        memory: 6Gi
replicaCount: 1
