# Gitea's Redis cache adapter writes each cache key to a string with a TTL and
# also records the key as a field of the MacaronCache hash. Nothing deletes the
# hash field when the string expires, so the hash grows forever. On 2026-11-26
# it held 3.4M fields, pushed valkey past its 1Gi limit, and Gitea returned 500
# for every page that touches a session. The hash is only an index used by
# cache flushes and lazy cleanup, so dropping it loses just the index.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: valkey-cache-index-cleanup
  namespace: gitea
spec:
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: docker.io/bitnamilegacy/valkey:8.1.3-debian-12-r3
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -c
                - valkey-cli -h gitea-valkey-primary.gitea.svc.cluster.local --no-auth-warning DEL MacaronCache
              env:
                - name: REDISCLI_AUTH
                  valueFrom:
                    secretKeyRef:
                      name: gitea-valkey
                      key: valkey-password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 64Mi
