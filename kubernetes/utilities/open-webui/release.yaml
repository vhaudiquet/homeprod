apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 1m
  chart:
    spec:
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: open-webui
      chart: open-webui
      version: '16.0.0'
      interval: 1m
  valuesFrom:
    - kind: Secret
      name: open-webui-values
