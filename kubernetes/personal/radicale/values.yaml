# Radicale CalDAV/CardDAV server
# The chart uses the official rootless ghcr.io/kozea/radicale image with a
# hardened securityContext by default (non-root, read-only rootfs, all caps dropped).
replicaCount: 1
env:
    - name: TZ
      value: ENC[AES256_GCM,data:KEcOJfkU2JYAOQv8,iv:DrPCrrhkXja3gst7OJKJ+aWvZiO2+ITw420JBukOR0Q=,tag:uDvIa1XZJGfyoYlikkxJpQ==,type:str]
config:
    # No authentication, LAN-only exposure behind Traefik. 
    auth:
        type: none
ingress:
    enabled: true
    className: traefik
    annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
    hosts:
        - host: radicale.lan
          paths:
            - path: /
              pathType: Prefix
persistence:
    data:
        enabled: true
        className: longhorn
        size: 5Gi
        accessMode: ReadWriteOnce
resources:
    requests:
        cpu: 50m
        memory: 128Mi
    limits:
        cpu: 500m
        memory: 256Mi
