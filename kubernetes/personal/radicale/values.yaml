# Radicale CalDAV/CardDAV server
# The chart uses the official rootless ghcr.io/kozea/radicale image with a
# hardened securityContext by default (non-root, read-only rootfs, all caps dropped).
replicaCount: 1
env:
    - name: TZ
      value: ENC[AES256_GCM,data:aOeUzoi3PC8rjf8A,iv:xJpXljsxr61EhJvy6YiZU5mFXdWij6LCsQE8FIOgGZw=,tag:QMV8RzHlOilzTG45smv0yg==,type:str]
config:
    # No authentication, LAN-only exposure behind Traefik. 
    auth:
        type: none
ingress:
    enabled: true
    className: traefik
    annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
    hosts:
        - host: radicale.lan
          paths:
            - path: /
              pathType: Prefix
persistence:
    data:
        enabled: true
        className: longhorn
        size: 5Gi
        accessMode: ReadWriteOnce
resources:
    requests:
        cpu: 50m
        memory: 128Mi
    limits:
        cpu: 500m
        memory: 256Mi
