# Syncthing continuous file synchronization
#
# Sync ports (22000 TCP+QUIC, 21027 UDP) are exposed through LoadBalancer
# services on the dedicated Cilium pool IP 10.2.2.7 (appended to
# kubernetes/system/cilium/pool.yaml). The GUI goes through Traefik like the
# other *.lan services.
controller:
    replicas: 1
image:
    repository: syncthing/syncthing
    tag: "2.1"
env:
    - name: TZ
      value: Europe/Paris
    - name: PUID
      value: "1000"
    - name: PGID
      value: "1000"
podSecurityContext:
    fsGroup: 1000
service:
    main:
        ports:
            http:
                port: 8384
    # Sync protocol and QUIC share 22000 on the pooled IP; LAN discovery
    # rides on UDP 21027. externalTrafficPolicy Local preserves client IPs.
    listen:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Local
        loadBalancerIP: 10.2.2.7
        ports:
            listen:
                enabled: true
                port: 22000
                protocol: TCP
                targetPort: 22000
            quic:
                enabled: true
                port: 22000
                protocol: UDP
                targetPort: 22000
    discovery:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Local
        loadBalancerIP: 10.2.2.7
        ports:
            discovery:
                enabled: true
                port: 21027
                protocol: UDP
                targetPort: 21027
probes:
    liveness:
        custom: true
        spec:
            httpGet:
                path: /rest/noauth/health
                port: http
    readiness:
        custom: true
        spec:
            httpGet:
                path: /rest/noauth/health
                port: http
ingress:
    main:
        enabled: true
        ingressClassName: traefik
        annotations:
            external-dns.alpha.kubernetes.io/enabled: "true"
        hosts:
            - host: syncthing.lan
              paths:
                - path: /
                  pathType: Prefix
persistence:
    config:
        enabled: true
        mountPath: /var/syncthing/config
        storageClass: longhorn
        size: 5Gi
    # Shares are recreated by hand in the GUI after cutover — the instance
    # boots with a fresh config (see plans/syncthing-docker-to-kube-migration.md):
    # valentin's folders at /data/valentin/… and sarah's at /data/sarah/…, all
    # backed by the same TrueNAS exports as the docker stack. Photoprism
    # already mounts the valentin Photos export concurrently.
    valentin-documents:
        enabled: true
        type: custom
        mountPath: /data/valentin/Documents
        volumeSpec:
            nfs:
                server: truenas.lan
                path: /mnt/main_storage/valentin/Documents
    valentin-photos:
        enabled: true
        type: custom
        mountPath: /data/valentin/Photos
        volumeSpec:
            nfs:
                server: truenas.lan
                path: /mnt/main_storage/valentin/Photos
    sarah-documents:
        enabled: true
        type: custom
        mountPath: /data/sarah/Documents
        volumeSpec:
            nfs:
                server: truenas.lan
                path: /mnt/main_storage/sarah/Documents
    sarah-photos:
        enabled: true
        type: custom
        mountPath: /data/sarah/Photos
        volumeSpec:
            nfs:
                server: truenas.lan
                path: /mnt/main_storage/sarah/Photos
resources:
    requests:
        memory: 512Mi
    limits:
        memory: 2Gi
