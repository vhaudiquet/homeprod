apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: syncthing
  namespace: syncthing
spec:
  interval: 1m
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: k8s-home-lab
        namespace: syncthing
      chart: syncthing
      version: "5.2.0"
      interval: 1m
  valuesFrom:
    - kind: Secret
      name: syncthing-values
