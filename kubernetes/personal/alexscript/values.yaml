# alexscript — books HEM rooms on MyDiese when the window opens.
# One replica by design: the scheduler lives in the web process and the
# chart refuses replicaCount above 1.
replicaCount: 1
image:
    repository: git.vhaudiquet.fr/vhaudiquet/alexscript
    # Empty: follows the chart appVersion, the commit SHA CI stamped on the
    # pushed image.
    tag: ""
# MyDiese credentials. The password is encrypted at rest by the .sops.yaml
# creation rule for values.yaml.
auth:
    login: alexandre.haudiquet@etu.hesge.ch
    password: ENC[AES256_GCM,data:24gQnCGa9njjVw==,iv:qaS7TOA5KmimF8gEidee51gP7WKf6tn1NKwaCpppWic=,tag:UhkoMFwmmdHY7rGRo4QuHg==,type:str]
# The Flask UI has no authentication, so keep it on the LAN.
ingress:
    enabled: true
    className: traefik
    annotations:
        external-dns.alpha.kubernetes.io/enabled: "true"
    hosts:
        - host: alexscript.lan
          paths:
            - path: /
              pathType: Prefix
# SQLite database and room cache. Longhorn is the cluster's storage class.
persistence:
    enabled: true
    storageClassName: longhorn
    size: 1Gi
resources:
    requests:
        cpu: 50m
        memory: 128Mi
    limits:
        memory: 512Mi
