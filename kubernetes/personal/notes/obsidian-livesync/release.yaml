apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: obsidian-livesync
  namespace: obsidian-livesync
spec:
  interval: 1m
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: couchdb
        namespace: obsidian-livesync
      chart: couchdb
      version: "4.6.3"
      interval: 1m
  valuesFrom:
    - kind: Secret
      name: obsidian-livesync-values
