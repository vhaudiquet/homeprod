# CouchDB for Obsidian LiveSync
# Single-node deployment with CORS configured for Obsidian plugin compatibility
clusterSize: 1
allowAdminParty: false
createAdminSecret: ENC[AES256_GCM,data:qCS2Aw==,iv:krKXRZ/w5sXAdb6LQqqKm2bABA68QGxV/x0zalpwFgs=,tag:j4apfBIYrPrgZGBp5vIH0g==,type:bool]
autoSetup:
    enabled: true
adminUsername: obsidian
adminPassword: ENC[AES256_GCM,data:jKwtIOt0yvxfoS7JhXs=,iv:j3KMCBjl4mtg+Tkbt4ooZnqvd8tGKkUf2psJlws31Ag=,tag:AjJkxLbOKx1kBlOfPRS68w==,type:str]
image:
    repository: couchdb
    tag: 3.5.2
    pullPolicy: IfNotPresent
# Enable CORS for Obsidian LiveSync plugin
# Equivalent to the Traefik CORS middleware in the Docker setup,
# but handled natively by CouchDB (cleaner and more reliable)
couchdbConfig:
    couchdb:
        uuid: b0a1c2d3-e4f5-6789-abcd-ef0123456789
    cluster:
        q: 1
    chttpd:
        bind_address: any
        require_valid_user: false
    httpd:
        enable_cors: "true"
    cors:
        credentials: "true"
        origins: app://obsidian.md,capacitor://localhost,http://localhost
        headers: accept,authorization,content-type,origin,referer
        methods: GET,PUT,POST,HEAD,DELETE
persistentVolume:
    enabled: true
    accessModes:
        - ReadWriteOnce
    size: 5Gi
    storageClass: longhorn
ingress:
    enabled: true
    className: traefik
    hosts:
        - obsidian-livesync.lan
    path: /
    annotations: {}
resources:
    requests:
        cpu: 100m
        memory: 256Mi
    limits:
        cpu: 500m
        memory: 512Mi
