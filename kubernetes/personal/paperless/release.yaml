apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
  namespace: paperless
spec:
  interval: 1m
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: paperless
        namespace: paperless
      chart: paperless
      version: "11.4.0"
      interval: 1m
  dependsOn:
    - name: paperless-postgres
    - name: paperless-redis
  valuesFrom:
    - kind: Secret
      name: paperless-values
