apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-redis
  namespace: paperless
spec:
  interval: 1m
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: cloudpirates
        namespace: paperless
      chart: redis
      version: "0.35.1"
      interval: 1m
  valuesFrom:
    - kind: Secret
      name: paperless-redis-values
