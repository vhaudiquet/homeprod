apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless-postgres
  namespace: paperless
spec:
  interval: 1m
  chart:
    spec:
      sourceRef:
        kind: HelmRepository
        name: cloudpirates
        namespace: paperless
      chart: postgres
      version: "0.20.0"
      interval: 1m
  valuesFrom:
    - kind: Secret
      name: paperless-postgres-values
