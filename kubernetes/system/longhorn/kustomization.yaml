apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system
resources:
  - namespace.yaml
  - repository.yaml
  - release.yaml
  - recurring-jobs.yaml
secretGenerator:
  - name: longhorn-values
    files:
      - values.yaml=values.yaml
configurations:
  - kustomizeconfig.yaml
